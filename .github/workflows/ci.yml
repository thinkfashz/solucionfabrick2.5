name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck · build diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'

      - name: Prepare pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --no-frozen-lockfile 2>&1 | tee install.log

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run typecheck 2>&1 | tee typecheck.log

      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        env:
          CI: 'true'
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee build.log

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-ci-diagnostic
          path: |
            install.log
            typecheck.log
            build.log
          if-no-files-found: warn
          retention-days: 2

      - name: Fail when validation failed
        if: steps.typecheck.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1
