      <circle cx="80" cy="89" r="5.5" fill="url(#goldSoftL)"/>
    </g>
  </g>

  <text x="310" y="156" font-family="Sora, Manrope, Arial, Helvetica, sans-serif" font-size="98" font-weight="800" letter-spacing="2" fill="url(#wordL)">SOLUCIONES</text>
  <text x="310" y="248" font-family="Sora, Manrope, Arial, Helvetica, sans-serif" font-size="98" font-weight="800" letter-spacing="6" fill="url(#goldL)">FABRICK</text>
  <path d="M258 288h912" stroke="url(#lineL)" stroke-width="3"/>
  <text x="310" y="306" font-family="Sora, Manrope, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="9" fill="#7A7268">CONSTRUCCIÓN · REMODELACIÓN · HOGAR</text>
