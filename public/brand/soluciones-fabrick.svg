  <text x="310" y="306" font-family="Sora, Manrope, Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="9" fill="#9C958B">CONSTRUCCIÓN · REMODELACIÓN · HOGAR</text>
