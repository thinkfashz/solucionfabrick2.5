<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Soluciones Fabrick</title>
  <desc id="desc">Logotipo Soluciones Fabrick para superficies claras: isotipo de techo arquitectónico y wordmark tipográfico.</desc>
  <defs>
    <linearGradient id="roofL" x1="18" y1="26" x2="142" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3A3E46"/>
      <stop offset="0.5" stop-color="#17181C"/>
      <stop offset="1" stop-color="#0C0D10"/>
    </linearGradient>
    <linearGradient id="goldL" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F9CF6B"/>
      <stop offset="0.5" stop-color="#E3B44C"/>
      <stop offset="1" stop-color="#A96F0B"/>
    </linearGradient>
    <linearGradient id="goldSoftL" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F5DFA6"/>
      <stop offset="1" stop-color="#C99418"/>
    </linearGradient>
    <linearGradient id="wordL" x1="330" y1="0" x2="1160" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202328"/>
      <stop offset="0.55" stop-color="#45484F"/>
      <stop offset="1" stop-color="#6E6F74"/>
    </linearGradient>
    <linearGradient id="lineL" x1="258" y1="0" x2="1170" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A96F0B" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#A96F0B"/>
      <stop offset="0.7" stop-color="#A96F0B"/>
      <stop offset="1" stop-color="#A96F0B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g transform="translate(60 24) scale(1.42)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 118 80 24l62 94" stroke="url(#goldL)" stroke-width="3.5"/>
      <path d="M26 116 80 36l54 80" stroke="url(#roofL)" stroke-width="8"/>
      <path d="M34 115 80 47l46 68" stroke="url(#goldSoftL)" stroke-width="2.4"/>
    </g>
    <path d="M104 70V44h20v40" fill="url(#roofL)"/>
    <path d="M100 70h28" stroke="url(#goldL)" stroke-width="3"/>
    <path d="M56 132h48" stroke="url(#goldL)" stroke-width="5" stroke-linecap="round"/>
    <g fill="url(#goldL)">
