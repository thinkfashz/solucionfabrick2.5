<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fabrick Home Walkthrough</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10130f;font-family:Inter,system-ui,sans-serif;color:#fff}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}.glass{background:rgba(11,17,12,.76);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px);box-shadow:0 12px 35px #0007}
header{position:absolute;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand,.tools{pointer-events:auto;border-radius:22px;padding:10px 14px}.brand b{color:#ffca45}.brand small{display:block;color:#cbd2c9}.tools{display:flex;gap:7px}button{border:0;border-radius:14px;padding:10px 13px;background:#283128;color:white;font-weight:750;cursor:pointer}button.active,button:hover{background:#ffca45;color:#151812}
#room{position:absolute;top:86px;left:16px;padding:9px 13px;border-radius:14px;color:#ffda71;font-weight:800}.tip{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);padding:11px 16px;border-radius:17px;text-align:center;max-width:82%;font-size:14px}.cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}.cross:before,.cross:after{content:"";position:absolute;background:#ffd15c}.cross:before{width:18px;height:2px;top:8px}.cross:after{width:2px;height:18px;left:8px}
#mobile{display:none;pointer-events:none}.pad{pointer-events:auto;position:absolute;bottom:26px;width:112px;height:112px;border-radius:50%;background:#111a;border:1px solid #ffffff55}.pad.left{left:24px}.pad.right{right:24px}.knob{position:absolute;width:46px;height:46px;left:33px;top:33px;border-radius:50%;background:#ffca45cc}
#gallery{display:none;position:fixed;inset:0;z-index:10;background:#060806f2;padding:18px;overflow:auto}#gallery.open{display:block}.ghead{display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:auto}.grid{max-width:1200px;margin:16px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.card{background:#1a201a;border-radius:18px;overflow:hidden;border:1px solid #ffffff22;cursor:pointer}.card img{width:100%;height:170px;object-fit:cover}.card div{padding:10px;font-weight:700}.viewer{display:none;position:fixed;inset:0;z-index:20;background:#000}.viewer.open{display:block}.viewer iframe{width:100%;height:100%;border:0}.viewer button{position:absolute;right:18px;top:18px;z-index:2}
@media(max-width:760px){#mobile{display:block}.tools button:nth-child(1){display:none}.tip{bottom:150px}.brand small{display:none}.tools{padding:6px}.tools button{padding:9px}.cross{display:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
</head>
<body>
<div id="hud">
<header><div class="brand glass"><b>FABRICK HOME</b><small>recorrido 3D interactivo</small></div><div class="tools glass"><button id="walk">Caminar</button><button id="lights">Luces</button><button id="photos">Vistas 360</button><button id="reset">Reiniciar</button></div></header>
<div id="room" class="glass">Living</div><div class="cross"></div>
<div class="tip glass" id="tip">WASD para caminar · arrastra para mirar · toca puertas, manillas y luces</div>
<div id="mobile"><div class="pad left"><div class="knob"></div></div><div class="pad right"><div class="knob"></div></div></div>
</div>
<div id="gallery"><div class="ghead"><h2>Referencias 360 del recorrido</h2><button id="closeGallery">Volver al 3D</button></div><div class="grid" id="grid"></div></div>
<div class="viewer" id="viewer"><button id="closeViewer">Cerrar 360</button><iframe id="pano"></iframe></div>
<script type="module">
import * as THREE from "three";
import {PointerLockControls} from "three/addons/controls/PointerLockControls.js";
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9aa795);scene.fog=new THREE.Fog(0x9aa795,25,52);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,100);camera.position.set(-4.8,1.65,2.5);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe7f1ff,0x485442,1.6));const sun=new THREE.DirectionalLight(0xfff2d2,2.4);sun.position.set(-7,12,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const mat=(c,r=.75,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const white=mat(0xf1efe9),oak=mat(0xa47748),dark=mat(0x171a18,.42,.25),floor=mat(0xd9d1c4,.55),tile=mat(0xc9ced0,.35),glass=new THREE.MeshPhysicalMaterial({color:0xb8daf2,transparent:true,opacity:.25,roughness:.1,transmission:.55});
const interact=[],colliders=[],lamps=[];function box(n,s,p,ma,cast=true){const o=new THREE.Mesh(new THREE.BoxGeometry(...s),ma);o.name=n;o.position.set(...p);o.castShadow=cast;o.receiveShadow=true;scene.add(o);return o}
box("radier",[16,.3,11],[0,-.18,0],mat(0x686b66));box("piso",[15.5,.12,10.5],[0,0,0],floor);
function wall(x,z,w,d,h=2.75){const o=box("muro",[w,h,d],[x,h/2,z],white);colliders.push({x,z,hx:w/2+.24,hz:d/2+.24});return o}
wall(0,-5.1,15.5,.18);wall(0,5.1,15.5,.18);wall(-7.65,0,.18,10.4);wall(7.65,0,.18,10.4);
wall(1.1,1.05,.16,8.1);wall(4.25,-.7,6.3,.16);wall(4.25,3.05,6.3,.16);
wall(3.0,-3.1,.16,3.85);wall(5.5,-3.1,.16,3.85);
const ceiling=box("cielo",[15.5,.12,10.5],[0,2.8,0],white,false);
function window3(x,y,z,w,h,rot=0){const frame=box("ventana",[w+.12,h+.12,.08],[x,y,z],dark);frame.rotation.y=rot;const pane=box("vidrio",[w,h,.04],[x,y,z],glass,false);pane.rotation.y=rot}
window3(-3.7,1.45,-5.02,3.5,1.45);window3(-6.95,1.45,5.02,1.2,1.4);window3(6.7,1.45,5.02,1.25,1.4);
function door(x,z,rot=0,label="Puerta"){const pivot=new THREE.Group();pivot.position.set(x,0,z);pivot.rotation.y=rot;scene.add(pivot);const leaf=new THREE.Mesh(new THREE.BoxGeometry(1,.06,2.15),oak);leaf.position.set(.5,1.075,0);leaf.castShadow=true;pivot.add(leaf);const handle=new THREE.Mesh(new THREE.SphereGeometry(.06,16,12),dark);handle.position.set(.87,1.08,.07);leaf.add(handle);pivot.userData={kind:"door",open:false,label};leaf.userData.target=pivot;handle.userData.target=pivot;interact.push(leaf,handle);return pivot}
door(1.0,-1.75,Math.PI/2,"Dormitorio");door(3.05,-1.0,0,"Baño");door(1.0,3.7,Math.PI/2,"Habitación");
function table(x,z,w,d){box("mesa",[w,.1,d],[x,.78,z],oak);[[-1,-1],[-1,1],[1,-1],[1,1]].forEach(q=>box("pata",[.09,.75,.09],[x+q[0]*(w/2-.12),.38,z+q[1]*(d/2-.12)],dark))}
box("sofa",[2.8,.55,1.0],[-4.7,.42,1.7],mat(0x5b6260));box("respaldo",[2.8,.8,.28],[-4.7,.92,2.1],mat(0x5b6260));table(-2.0,1.2,1.3,.7);
table(-3.4,-2.0,2.3,1.05);for(let i=0;i<4;i++)box("silla",[.48,.8,.48],[-4.15+i%2*1.5,.42,-2.75+Math.floor(i/2)*1.5],mat(0x282b27));
box("meson",[4.2,.92,.7],[-1.1,.47,-4.55],dark);box("isla",[2.4,.92,.9],[-1.3,.47,-3.0],mat(0xd8d2c7));
box("cama",[3.2,.5,2.1],[4.25,.32,-1.85],mat(0xddd7cd));box("cabecero",[3.2,1,.14],[4.25,.65,-2.85],oak);
box("wc",[.65,.7,.8],[4.1,.35,-4.05],white);box("ducha",[1.15,.06,1.15],[6.7,.05,-4.25],tile);
function lamp(x,z){const l=new THREE.PointLight(0xffd88f,0,6,1.7);l.position.set(x,2.48,z);scene.add(l);const bulb=box("Luz",[.22,.08,.22],[x,2.62,z],mat(0xffd36a, .2));bulb.userData={kind:"light",light:l};interact.push(bulb);lamps.push(l)}
[[-4,1],[-3,-3],[3,1],[4,-2],[5,-4],[4,4]].forEach(p=>lamp(...p));
const outside=box("terreno",[45,.15,45],[0,-.35,0],mat(0x497244));outside.receiveShadow=true;
const controls=new PointerLockControls(camera,renderer.domElement);document.getElementById("walk").onclick=()=>controls.lock();document.addEventListener("pointerlockchange",()=>document.getElementById("walk").classList.toggle("active",controls.isLocked));
const keys={};addEventListener("keydown",e=>keys[e.code]=true);addEventListener("keyup",e=>keys[e.code]=false);
let yaw=0,pitch=0,drag=false,lastX=0,lastY=0;renderer.domElement.addEventListener("pointerdown",e=>{if(innerWidth>760&&!controls.isLocked){drag=true;lastX=e.clientX;lastY=e.clientY}});addEventListener("pointerup",()=>drag=false);addEventListener("pointermove",e=>{if(drag){yaw-=(e.clientX-lastX)*.004;pitch=Math.max(-1.25,Math.min(1.25,pitch-(e.clientY-lastY)*.004));camera.rotation.set(pitch,yaw,0,"YXZ");lastX=e.clientX;lastY=e.clientY}});
const ray=new THREE.Raycaster();function activate(x,y){ray.setFromCamera(new THREE.Vector2(x,y),camera);const hit=ray.intersectObjects(interact,false)[0];if(!hit||hit.distance>3)return;const t=hit.object.userData.target||hit.object;if(t.userData.kind==="door"){t.userData.open=!t.userData.open;t.userData.from=t.rotation.y;t.userData.to=t.userData.open?t.userData.from-Math.PI/2:t.userData.from+Math.PI/2}else if(t.userData.kind==="light"){t.userData.light.intensity=t.userData.light.intensity?0:7}}
renderer.domElement.addEventListener("click",e=>{if(!drag)activate((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1)});
function blocked(x,z){if(Math.abs(x)>7.25||Math.abs(z)>4.7)return true;return colliders.some(c=>Math.abs(x-c.x)<c.hx&&Math.abs(z-c.z)<c.hz)}
let moveX=0,moveZ=0,lookX=0,lookY=0;document.querySelectorAll(".pad").forEach(p=>{const k=p.querySelector(".knob"),right=p.classList.contains("right");const end=()=>{k.style.transform="";if(right)lookX=lookY=0;else moveX=moveZ=0};p.addEventListener("pointerdown",e=>p.setPointerCapture(e.pointerId));p.addEventListener("pointermove",e=>{if(!p.hasPointerCapture(e.pointerId))return;const r=p.getBoundingClientRect(),dx=Math.max(-38,Math.min(38,e.clientX-r.left-r.width/2)),dy=Math.max(-38,Math.min(38,e.clientY-r.top-r.height/2));k.style.transform="translate("+dx+"px,"+dy+"px)";if(right){lookX=dx/38;lookY=dy/38}else{moveX=dx/38;moveZ=dy/38}});p.addEventListener("pointerup",end);p.addEventListener("pointercancel",end)});
document.querySelector(".pad.right").addEventListener("click",()=>activate(0,0));
const rooms=[["Living",-7,1,-1,4.8],["Comedor",-7,-4.8,-1,-.4],["Cocina",-2.9,-5,-.1,-1.4],["Pasillo",1.2,.9,-5,4.8],["Dormitorio",3.2,-.5,-3,-1.1],["Baño",3.2,5.3,-4.8,-3.2],["Habitación",1.3,7.3,1.3,4.8]];
function roomName(x,z){const r=rooms.find(a=>x>a[1]&&x<a[2]&&z>a[3]&&z<a[4]);return r?r[0]:"Recorrido"}
const urls=[
["01 · Entrada / Living","https://res.cloudinary.com/disghf6xc/image/upload/v1789388865/soluciones-fabrick/recorrido-interior-360/01-entrada-living.webp"],
["02 · Sala principal","https://res.cloudinary.com/disghf6xc/image/upload/v1789388870/soluciones-fabrick/recorrido-interior-360/02-sala-principal.webp"],
["03 · Comedor","https://res.cloudinary.com/disghf6xc/image/upload/v1789388874/soluciones-fabrick/recorrido-interior-360/03-comedor.webp"],
["04 · Pasillo","https://res.cloudinary.com/disghf6xc/image/upload/v1789388878/soluciones-fabrick/recorrido-interior-360/04-pasillo-habitaciones.webp"],
["05 · Dormitorio","https://res.cloudinary.com/disghf6xc/image/upload/v1789388882/soluciones-fabrick/recorrido-interior-360/05-dormitorio-principal.webp"],
["06 · Baño","https://res.cloudinary.com/disghf6xc/image/upload/v1789388886/soluciones-fabrick/recorrido-interior-360/06-bano.webp"],
["07 · Cocina","https://res.cloudinary.com/disghf6xc/image/upload/v1789388890/soluciones-fabrick/recorrido-interior-360/07-cocina.webp"],
["08 · Vista exterior","https://res.cloudinary.com/disghf6xc/image/upload/v1789388894/soluciones-fabrick/recorrido-interior-360/08-vista-exterior.webp"]];
const grid=document.getElementById("grid");urls.forEach(u=>{const c=document.createElement("article");c.className="card";c.innerHTML='<img src="'+u[1]+'" alt="'+u[0]+'"><div>'+u[0]+"</div>";c.onclick=()=>{document.getElementById("viewer").classList.add("open");document.getElementById("pano").src="https://cdn.pannellum.org/2.5/pannellum.htm#panorama="+encodeURIComponent(u[1])+"&autoLoad=true&autoRotate=-2"};grid.appendChild(c)});
const gallery=document.getElementById("gallery");document.getElementById("photos").onclick=()=>gallery.classList.add("open");document.getElementById("closeGallery").onclick=()=>gallery.classList.remove("open");document.getElementById("closeViewer").onclick=()=>{document.getElementById("viewer").classList.remove("open");document.getElementById("pano").src=""};document.getElementById("lights").onclick=()=>lamps.forEach(l=>l.intensity=l.intensity?0:7);document.getElementById("reset").onclick=()=>camera.position.set(-4.8,1.65,2.5);
let prev=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min(.04,(now-prev)/1000);prev=now;if(innerWidth<=760){yaw-=lookX*dt*1.7;pitch=Math.max(-1.25,Math.min(1.25,pitch-lookY*dt*1.2));camera.rotation.set(pitch,yaw,0,"YXZ")}let f=(keys.KeyW?1:0)-(keys.KeyS?1:0)-moveZ,r=(keys.KeyD?1:0)-(keys.KeyA?1:0)+moveX;if(f||r){const l=Math.hypot(f,r)||1,sp=2.8*dt,nx=camera.position.x+((Math.sin(yaw)*-f+Math.cos(yaw)*r)/l)*sp,nz=camera.position.z+((Math.cos(yaw)*-f-Math.sin(yaw)*r)/l)*sp;if(!blocked(nx,camera.position.z))camera.position.x=nx;if(!blocked(camera.position.x,nz))camera.position.z=nz}interact.forEach(o=>{const t=o.userData.target||o;if(t.userData.to!==undefined){t.rotation.y=THREE.MathUtils.lerp(t.rotation.y,t.userData.to,.12);if(Math.abs(t.rotation.y-t.userData.to)<.01)delete t.userData.to}});document.getElementById("room").textContent=roomName(camera.position.x,camera.position.z);renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
