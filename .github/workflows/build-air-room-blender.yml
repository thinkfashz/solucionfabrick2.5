name: Build premium air room GLB

on:
  push:
    branches:
      - fix/unified-home-cms-media-ai
    paths:
      - scripts/blender/build-air-room-premium.py
      - .github/workflows/build-air-room-blender.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unified-home-cms-media-ai
          fetch-depth: 0

      - name: Download Blender 5.2.1 LTS
        run: |
          curl -L --fail --retry 3 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz
          mkdir -p /tmp/blender
          tar -xf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1

      - name: Generate optimized GLB
        env:
          FABRICK_OUT: ${{ github.workspace }}/public/models/air-room-premium.glb
        run: |
          mkdir -p public/models
          /tmp/blender/blender --background --factory-startup --python scripts/blender/build-air-room-premium.py
          ls -lh public/models/air-room-premium.glb

      - name: Commit generated model
        run: |
          if git diff --quiet -- public/models/air-room-premium.glb && git ls-files --error-unmatch public/models/air-room-premium.glb >/dev/null 2>&1; then
            echo "GLB unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/air-room-premium.glb
          git commit -m "feat(air): generate Blender premium room model"
          git push origin HEAD:fix/unified-home-cms-media-ai
