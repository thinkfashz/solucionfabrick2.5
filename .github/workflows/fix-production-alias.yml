name: Repair production alias

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repair-alias:
    if: github.event.head_commit.message == 'ops: repair production alias'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Vercel token
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || (echo "VERCEL_TOKEN is missing" && exit 1)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Point custom domains to READY deployment
        shell: bash
        run: |
          vercel alias set solucionfabrick-p37ozbsbp-think-fastzs-projects.vercel.app www.solucionesfabrick.com --token="$VERCEL_TOKEN"
          vercel alias set solucionfabrick-p37ozbsbp-think-fastzs-projects.vercel.app solucionesfabrick.com --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_TZgqGIz6S5jHiYRoWSHNRzJQ
          VERCEL_PROJECT_ID: prj_spvhOqbD6vthFGyvuTRMTGsfHpNu
