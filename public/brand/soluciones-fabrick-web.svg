<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 320" role="img" aria-labelledby="title desc">
  <title id="title">Soluciones Fabrick</title>
  <desc id="desc">Logo horizontal profesional de Soluciones Fabrick optimizado para web y tablet.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2ad"/>
      <stop offset=".25" stop-color="#ffd24a"/>
      <stop offset=".58" stop-color="#f29a00"/>
      <stop offset="1" stop-color="#9d5000"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".34" stop-color="#d0d3d8"/>
      <stop offset=".7" stop-color="#747980"/>
      <stop offset="1" stop-color="#f4f5f6"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>

  <g transform="translate(36 16)" filter="url(#soft)">
    <path d="M38 165 280 39l144 73v-38h31v54l116 59h-45L280 60 77 170Z" fill="none" stroke="url(#steel)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M39 175 280 52l144 73" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M424 112V74h31v54" fill="none" stroke="url(#steel)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="690" y="150" font-size="48" font-weight="800" letter-spacing="7" fill="#f2ede5">SOLUCIONES</text>
    <text x="690" y="231" font-size="96" font-weight="900" letter-spacing="-2" fill="url(#gold)">FABRICK</text>
    <rect x="691" y="251" width="405" height="3" rx="1.5" fill="url(#gold)" opacity=".7"/>
    <text x="690" y="286" font-size="20" font-weight="700" letter-spacing="5" fill="#d6d2cb" opacity=".78">CONSTRUCCIÓN · REMODELACIÓN · SOLUCIONES</text>
  </g>
