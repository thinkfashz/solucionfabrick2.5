<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title desc">
  <title id="title">Soluciones Fabrick</title>
  <desc id="desc">Logo horizontal compacto de Soluciones Fabrick optimizado para navegación móvil.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a4"/>
      <stop offset=".28" stop-color="#ffc83d"/>
      <stop offset=".58" stop-color="#f39a00"/>
      <stop offset="1" stop-color="#9b4d00"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".38" stop-color="#c9ccd1"/>
      <stop offset=".72" stop-color="#70757b"/>
      <stop offset="1" stop-color="#f5f6f7"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <g filter="url(#soft)">
    <path d="M63 118 238 30l104 53v-27h24v39l78 40h-36L238 48 92 122Z" fill="none" stroke="url(#steel)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M64 124 238 41l104 53" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M342 83V56h24v39" fill="none" stroke="url(#steel)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="900" text-anchor="middle">
    <text x="380" y="177" font-size="58" letter-spacing="-1.5" fill="url(#gold)">SOLUCIONES FABRICK</text>
    <text x="380" y="205" font-size="17" font-weight="700" letter-spacing="4.2" fill="#f5f0e6" opacity=".78">CONSTRUCCIÓN · REMODELACIÓN</text>
  </g>
</svg>
